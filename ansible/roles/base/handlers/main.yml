---
- name: Reload sshd
  ansible.builtin.systemd_service:
    name: sshd
    state: reloaded

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart journald
  ansible.builtin.systemd_service:
    name: systemd-journald
    state: restarted
  notify: Move the journal to disk

# A restart alone keeps writing to /run; a flush moves the journal to
# /var/log/journal.
- name: Move the journal to disk
  ansible.builtin.command: journalctl --flush
  changed_when: true
