---
# Where each secret is in pass.
aap_pass_entries:
  gateway_admin: taelron/platform/aap/admin-password
  controller_admin: taelron/platform/aap/controller-admin-password
  hub_admin: taelron/platform/aap/hub-admin-password
  eda_admin: taelron/platform/aap/eda-admin-password
  gateway_pg: taelron/platform/postgresql/aap_gateway
  controller_pg: taelron/platform/postgresql/aap_controller
  hub_pg: taelron/platform/postgresql/aap_hub
  eda_pg: taelron/platform/postgresql/aap_eda
  metrics_pg: taelron/platform/postgresql/aap_metrics
  metrics_reader_pg: taelron/platform/postgresql/ms_awx_readonly
  event_stream_pg: taelron/platform/postgresql/eda_event_stream

# The installer unpacks into a folder named like its archive.
aap_installer_dir: "{{ aap_home }}/{{ aap_installer_file | regex_replace('\\.tar\\.gz$', '') }}"
