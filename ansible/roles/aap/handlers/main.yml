---
- name: Relabel the AAP volume
  ansible.builtin.command: restorecon -R /var/lib/aap
  changed_when: true

- name: Decode the subscription manifest
  ansible.builtin.shell:
    cmd: base64 -d manifest.zip.b64 > manifest.zip && chmod 0600 manifest.zip
    chdir: "{{ aap_home }}"
  become: true
  become_user: "{{ aap_user }}"
  changed_when: true
