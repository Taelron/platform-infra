---
# CAPLV (in the mgmt cluster) creates and deletes the cluster VMs through
# libvirt over SSH, as this user. Its libvirt client (go-libvirt) runs no
# command: it opens a forwarded Unix socket to /var/run/libvirt/libvirt-sock
# (virtproxyd). So the user has no login shell, and sshd lets it forward local
# Unix sockets only. Group libvirt gives it libvirt's system instance (polkit),
# which manages VMs: this is the trust CAPLV needs, accepted with it (Platform
# Design Decisions 6).
- name: Create the CAPLV user
  ansible.builtin.user:
    name: "{{ kvm_caplv_user }}"
    comment: Cluster API libvirt provider
    groups: [libvirt]
    append: true
    shell: /sbin/nologin
    create_home: true
    password: "!"

- name: Create the folder of CAPLV's key
  ansible.builtin.file:
    path: "{{ kvm_caplv_key | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

# Made once on the host, never in Git or SSM: the private key goes only to
# the mgmt cluster, as the Secret CAPLV mounts (role k3s_rancher).
- name: Create CAPLV's SSH key pair
  ansible.builtin.command: >-
    ssh-keygen -q -t ed25519 -N '' -C caplv@{{ inventory_hostname }} -f {{ kvm_caplv_key }}
  args:
    creates: "{{ kvm_caplv_key }}"

- name: Read CAPLV's public key
  ansible.builtin.slurp:
    src: "{{ kvm_caplv_key }}.pub"
  register: kvm_caplv_pub
  check_mode: false
  failed_when: false

# At the end of sshd_config: a Match block ends only at the next Match or at
# the end of the file, so it cannot sit in a drop-in read first.
# AllowTcpForwarding local: OpenSSH checks a forwarded Unix socket against the
# same permission as a local TCP forward ("Received request to connect to
# path ..., but the request was denied" with "no"). The firewall then drops
# every new IP connection opened as caplv (role network, nft_deny_users), so
# the libvirt socket stays the only thing it can reach.
# Fail closed: sshd lets caplv forward TCP only once the firewall drops every
# IP connection caplv would open (role network runs first).
- name: Read the firewall's output chain
  ansible.builtin.command: nft list chain inet taelron output
  register: kvm_nft_output
  changed_when: false
  check_mode: false

- name: Read caplv's user ID (nft may list the rule by number)
  ansible.builtin.getent:
    database: passwd
    key: "{{ kvm_caplv_user }}"

- name: Refuse to open sshd for caplv before the firewall holds it
  ansible.builtin.assert:
    that: >-
      kvm_nft_output.stdout is search('skuid ("?' ~ kvm_caplv_user ~ '"?|'
      ~ ansible_facts.getent_passwd[kvm_caplv_user][1] ~ ') ct state new drop')
    fail_msg: The nftables rule for {{ kvm_caplv_user }} is not loaded; run role network first.
    quiet: true

- name: Let CAPLV forward local Unix sockets only, and nothing else
  ansible.builtin.blockinfile:
    path: /etc/ssh/sshd_config
    marker: "# {mark} Taelron: CAPLV (role kvm)"
    insertafter: EOF
    block: |
      Match User {{ kvm_caplv_user }}
          AllowStreamLocalForwarding local
          AllowTcpForwarding local
          AllowAgentForwarding no
          X11Forwarding no
          PermitTTY no
          PermitTunnel no
          GatewayPorts no
          ForceCommand /sbin/nologin
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload sshd

# sshd holds the block above before the key exists: never a moment with the
# key and without the limits.
- name: Reload sshd before installing the key
  ansible.builtin.meta: flush_handlers

# Not "restrict": it would also forbid the Unix socket forwarding CAPLV uses.
# sshd's block below allows that forwarding only.
- name: Let CAPLV sign in with its key, from the mgmt pods only
  ansible.posix.authorized_key:
    user: "{{ kvm_caplv_user }}"
    key: "{{ kvm_caplv_pub.content | b64decode }}"
    key_options: from="{{ k3s_pod_cidr }}",no-pty,no-agent-forwarding,no-X11-forwarding,no-user-rc
    exclusive: true
    state: present
  when: kvm_caplv_pub.content is defined
