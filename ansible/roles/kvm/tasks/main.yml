---
- name: Check that the instance offers virtualization
  ansible.builtin.stat:
    path: /dev/kvm
  register: kvm_device

- name: Stop if /dev/kvm is missing
  ansible.builtin.assert:
    that: kvm_device.stat.exists
    fail_msg: /dev/kvm is missing; the instance needs nested virtualization (tofu/platform).
    quiet: true

- name: Install KVM and libvirt
  ansible.builtin.dnf:
    name: [qemu-kvm, libvirt-daemon-kvm, libvirt-client, virt-install]
    state: present

# RHEL 9 runs libvirt as modular daemons, each started by its socket.
- name: Start the libvirt daemons on demand
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: started
    enabled: true
  loop: "{{ kvm_libvirt_sockets }}"
  ignore_errors: "{{ ansible_check_mode }}"

# A host stop shuts each VM down cleanly first. Without libvirt-guests,
# stopping virtqemud killed the VM outright, and a file written a minute
# before the stop was found empty on the node (TAE-139, 28 November 2026).
- name: Configure libvirt-guests
  ansible.builtin.template:
    src: libvirt-guests.j2
    dest: /etc/sysconfig/libvirt-guests
    owner: root
    group: root
    mode: "0644"

- name: Run libvirt-guests, so it acts at every host stop
  ansible.builtin.systemd_service:
    name: libvirt-guests
    state: started
    enabled: true
  ignore_errors: "{{ ansible_check_mode }}"

# The VMs use the four bridges only; libvirt's own NAT network would add a
# fifth zone, outside the design.
- name: Look for libvirt's default network
  ansible.builtin.command: virsh -c qemu:///system net-info default
  register: kvm_default_network
  changed_when: false
  failed_when: false
  check_mode: false

- name: Remove libvirt's default network
  ansible.builtin.shell: >-
    set -o pipefail;
    virsh -c qemu:///system net-destroy default || true;
    virsh -c qemu:///system net-undefine default
  args:
    executable: /bin/bash
  when: kvm_default_network.rc == 0
  changed_when: true

- name: Create the cluster networks
  ansible.builtin.import_tasks: networks.yml

- name: Create the storage pools and the node OS image
  ansible.builtin.import_tasks: storage.yml

- name: Give CAPLV its user on the host
  ansible.builtin.import_tasks: caplv.yml
