---
- name: Wait for the node to be ready
  ansible.builtin.command: >-
    /usr/local/bin/k3s kubectl wait node --all --for=condition=Ready --timeout=10s
  register: k3s_rancher_node
  until: k3s_rancher_node.rc == 0
  retries: 30
  delay: 10
  changed_when: false

# The charts are installed by k3s's Helm controller; pulling the images takes
# a few minutes on the first run.
- name: Wait for Rancher to be rolled out
  ansible.builtin.command: >-
    /usr/local/bin/k3s kubectl -n cattle-system rollout status deployment/rancher --timeout=10s
  register: k3s_rancher_rollout
  until: k3s_rancher_rollout.rc == 0
  retries: 60
  delay: 15
  changed_when: false

# Rancher fills server-url on the first sign-in in a browser; the agents of
# the clusters (Phase 5) need it, so it is set here.
- name: Read Rancher's server URL
  ansible.builtin.command: >-
    /usr/local/bin/k3s kubectl get settings.management.cattle.io server-url -o jsonpath={.value}
  register: k3s_rancher_server_url
  changed_when: false

- name: Set Rancher's server URL
  ansible.builtin.command: >-
    /usr/local/bin/k3s kubectl patch settings.management.cattle.io server-url --type=merge
    -p '{"value": "https://{{ rancher_hostname }}"}'
  when: k3s_rancher_server_url.stdout != 'https://' ~ rancher_hostname
  changed_when: true
