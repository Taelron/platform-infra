---
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

# k3s-selinux gives the binary its own type; a fresh file needs the label.
- name: Label the k3s binary
  ansible.builtin.command: restorecon -v /usr/local/bin/k3s
  changed_when: true

- name: Restart k3s
  ansible.builtin.systemd_service:
    name: k3s
    state: restarted
  ignore_errors: "{{ ansible_check_mode }}"
