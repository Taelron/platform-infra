---
- name: Create the bridges, the host at .1 on each
  community.general.nmcli:
    conn_name: "{{ item.name }}"
    ifname: "{{ item.name }}"
    type: bridge
    stp: false
    method4: manual
    ip4: >-
      {{ [item.prefix ~ '.1/24']
         + ((item.extra_hosts | default([])) | map('regex_replace', '^(.*)$', item.prefix ~ '.\1/24') | list) }}
    method6: disabled
    autoconnect: true
    state: present
  loop: "{{ bridges | rejectattr('libvirt', 'defined') }}"
  loop_control:
    label: "{{ item.name }}"

# The cluster bridges (libvirt: true) are libvirt networks, made by role kvm.

- name: Bring the bridges up
  ansible.builtin.command: nmcli connection up {{ item.name }}
  loop: "{{ bridges | rejectattr('libvirt', 'defined') }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.name not in ansible_facts.interfaces
  changed_when: true

- name: Install nftables
  ansible.builtin.dnf:
    name: nftables
    state: present

- name: Create the nftables folder
  ansible.builtin.file:
    path: /etc/nftables
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Write the firewall from the flow list
  ansible.builtin.template:
    src: taelron.nft.j2
    dest: /etc/nftables/taelron.nft
    owner: root
    group: root
    mode: "0600"
    validate: /usr/sbin/nft -c -f %s
  register: network_ruleset

- name: Remove the firewall from the stock nftables configuration
  ansible.builtin.lineinfile:
    path: /etc/sysconfig/nftables.conf
    line: include "/etc/nftables/taelron.nft"
    state: absent

# The stock unit runs "nft flush ruleset" on reload and stop, which would also
# remove the tables of libvirt, podman and k3s. It is masked, never stopped:
# stopping it would flush the firewall too.
- name: Turn the stock nftables unit off
  ansible.builtin.systemd_service:
    name: nftables
    enabled: false
    masked: true

- name: Install the unit that loads the firewall at boot
  ansible.builtin.copy:
    src: taelron-nft.service
    dest: /etc/systemd/system/taelron-nft.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Flush handlers so systemd knows the unit
  ansible.builtin.meta: flush_handlers

- name: Load the firewall, with a rollback if the host stops answering
  ansible.builtin.import_tasks: load_firewall.yml
  when: network_ruleset is changed and not ansible_check_mode

- name: Load the firewall at boot
  ansible.builtin.systemd_service:
    name: taelron-nft
    state: started
    enabled: true
  ignore_errors: "{{ ansible_check_mode }}"

# Only once the firewall is loaded: forwarding with no ruleset would let any
# traffic cross the bridges.
- name: Forward IPv4 between the bridges
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    sysctl_file: /etc/sysctl.d/90-taelron.conf
    state: present
    reload: true
