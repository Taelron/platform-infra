---
- name: Restart postgresql
  ansible.builtin.systemd_service:
    name: postgresql
    state: restarted
  ignore_errors: "{{ ansible_check_mode }}"

- name: Reload postgresql
  ansible.builtin.systemd_service:
    name: postgresql
    state: reloaded
  ignore_errors: "{{ ansible_check_mode }}"

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true
