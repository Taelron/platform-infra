---
- name: Read the role passwords from pass
  ansible.builtin.set_fact:
    postgresql_passwords: >-
      {{ (postgresql_passwords | default({}))
         | combine({item.name: lookup('community.general.passwordstore', 'taelron/platform/postgresql/' ~ item.name)}) }}
  loop: "{{ postgresql_databases }}"
  loop_control:
    label: "{{ item.name }}"
  when: postgresql_passwords is not defined or item.name not in postgresql_passwords
  no_log: true

- name: Enable the PostgreSQL stream {{ postgresql_stream }}
  ansible.builtin.dnf:
    name: "@postgresql:{{ postgresql_stream }}/server"
    state: present

- name: Install PostgreSQL
  ansible.builtin.dnf:
    name: [postgresql-server, postgresql-contrib, python3-psycopg2]
    state: present

- name: Create the data folder
  ansible.builtin.command: postgresql-setup --initdb
  args:
    creates: /var/lib/pgsql/data/PG_VERSION
  ignore_errors: "{{ ansible_check_mode }}"

- name: Create a TLS certificate for clients in the clusters
  ansible.builtin.import_tasks: tls.yml

- name: Write the platform settings
  ansible.builtin.template:
    src: taelron.conf.j2
    dest: /var/lib/pgsql/data/taelron.conf
    owner: postgres
    group: postgres
    mode: "0600"
  notify: Restart postgresql
  ignore_errors: "{{ ansible_check_mode }}"

- name: Include the platform settings
  ansible.builtin.lineinfile:
    path: /var/lib/pgsql/data/postgresql.conf
    line: include 'taelron.conf'
  notify: Restart postgresql
  ignore_errors: "{{ ansible_check_mode }}"

- name: Allow each role only its database, from where it runs
  ansible.builtin.template:
    src: pg_hba.conf.j2
    dest: /var/lib/pgsql/data/pg_hba.conf
    owner: postgres
    group: postgres
    mode: "0600"
  notify: Reload postgresql
  ignore_errors: "{{ ansible_check_mode }}"

- name: Install pgBackRest
  ansible.builtin.import_tasks: pgbackrest.yml

- name: Create the PostgreSQL unit drop-in folder
  ansible.builtin.file:
    path: /etc/systemd/system/postgresql.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Start PostgreSQL once the bridge addresses exist
  ansible.builtin.copy:
    dest: /etc/systemd/system/postgresql.service.d/10-taelron.conf
    content: |
      # PostgreSQL listens on {{ postgresql_address }}, on br-mgmt.
      [Unit]
      Wants=network-online.target
      After=network-online.target
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Run PostgreSQL
  ansible.builtin.systemd_service:
    name: postgresql
    state: started
    enabled: true
  ignore_errors: "{{ ansible_check_mode }}"

- name: Apply the settings before creating the databases
  ansible.builtin.meta: flush_handlers

- name: Create the roles and databases
  ansible.builtin.import_tasks: databases.yml
  when: not ansible_check_mode

- name: Create the backups
  ansible.builtin.import_tasks: backups.yml
