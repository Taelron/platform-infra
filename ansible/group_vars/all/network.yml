# Zones, addresses and flows, copied from Platform Design Decisions
# (Zones, Where services listen, Flows allowed by nftables). Every address a
# role uses comes from here.

host_vpc_interface: eth0
vpc_subnets: [10.20.1.0/24, 10.20.2.0/24]
aws_resolver: 10.20.0.2

# Pod range of the mgmt cluster (k3s default), on the host's bridge cni0.
k3s_pod_cidr: 10.42.0.0/16

# The four bridges; the host is .1 on each. br-mgmt also carries the host
# addresses of the services that run on the host itself; NetworkManager owns it.
# The three cluster bridges are libvirt networks (role kvm): CAPLV reads each
# VM's address from libvirt's DHCP leases (TAE-139, decided 28 November 2026),
# so libvirt runs DHCP on them, nodes from .50 to .99. libvirt adds no
# firewall rule (forward mode open) and no DNS: BIND on .1 stays the resolver.
bridges:
  - name: br-mgmt
    prefix: 192.168.10
    extra_hosts: [11, 12, 13, 14]
  - name: br-shared
    prefix: 192.168.20
    libvirt: true
    dhcp: [50, 99]
  - name: br-test
    prefix: 192.168.30
    libvirt: true
    dhcp: [50, 99]
  - name: br-demo
    prefix: 192.168.40
    libvirt: true
    dhcp: [50, 99]

# Host addresses on br-mgmt (decision 9).
postgresql_address: 192.168.10.11
aap_address: 192.168.10.12
rancher_address: 192.168.10.13
garage_address: 192.168.10.14

# Per cluster: its bridge's range, its API address (kube-vip on the control
# plane node; the nodes take DHCP addresses) and its gateways (Zones).
clusters:
  shared:
    bridge: br-shared
    cidr: 192.168.20.0/24
    api: 192.168.20.10
    public_gateway: 192.168.20.200
    internal_gateway: 192.168.20.201
  test:
    bridge: br-test
    cidr: 192.168.30.0/24
    api: 192.168.30.10
    public_gateway: 192.168.30.200
    internal_gateway: 192.168.30.201
  demo:
    bridge: br-demo
    cidr: 192.168.40.0/24
    api: 192.168.40.10
    public_gateway: 192.168.40.200
    internal_gateway: 192.168.40.201

# Flows allowed by nftables, numbered as in the design's flow table; 11 to 14
# and 15 to 17 added on 16 November 2026 (PO decisions, TAE-138). Anything not listed is
# dropped. "input" is traffic to an address on the host; "forward" is traffic
# between bridges. Traffic from the host itself is not filtered (flows 2, 3,
# 8, 12, 13, 14: the output chain accepts).
nft_flows:
  - id: 1
    why: Load balancer to HAProxy
    chain: input
    iif: [eth0]
    saddr: "{{ vpc_subnets }}"
    daddr: ["{{ host_vpc_address }}"]
    proto: tcp
    dport: [443]
  - id: 3
    why: test and demo Alloy to the shared internal gateway
    chain: forward
    iif: [br-test, br-demo]
    oif: [br-shared]
    daddr: ["{{ clusters.shared.internal_gateway }}"]
    proto: tcp
    dport: [443]
  - id: 4
    why: shared delivers to the test and demo cluster API
    chain: forward
    iif: [br-shared]
    oif: [br-test, br-demo]
    daddr: ["{{ clusters.test.api }}", "{{ clusters.demo.api }}"]
    proto: tcp
    dport: [6443]
  - id: 5
    why: Rancher agents to HAProxy
    chain: input
    iif: [br-shared, br-test, br-demo]
    daddr: ["{{ rancher_address }}"]
    proto: tcp
    dport: [443]
  - id: 6
    why: RKE2 control plane and apps to PostgreSQL
    chain: input
    iif: [br-shared, br-test, br-demo]
    daddr: ["{{ postgresql_address }}"]
    proto: tcp
    dport: [5432]
  - id: 7
    why: Every VM to BIND on its own bridge
    chain: input
    per_bridge_gateway: [br-shared, br-test, br-demo]
    proto: [tcp, udp]
    dport: [53]
  - id: 9
    why: shared to Garage
    chain: input
    iif: [br-shared]
    daddr: ["{{ garage_address }}"]
    proto: tcp
    dport: [3900]
  - id: 10
    why: test never reaches demo
    chain: forward
    iif: [br-test]
    oif: [br-demo]
    action: drop
  - id: 11
    why: SSH in, through Elastic IP 1 (the security group allows only the admin address)
    chain: input
    iif: [eth0]
    daddr: ["{{ host_vpc_address }}"]
    proto: tcp
    dport: [22]
  - id: 19
    why: Cluster VMs to libvirt's DHCP on their own bridge
    chain: input
    iif: [br-shared, br-test, br-demo]
    proto: udp
    dport: [67]
  - id: 20
    why: Cluster VMs to the host's chrony on their own bridge
    chain: input
    per_bridge_gateway: [br-shared, br-test, br-demo]
    proto: [udp]
    dport: [123]
  - id: 18
    why: AAP's job containers on the host to the host's sshd (local, on lo)
    chain: input
    iif: [lo]
    saddr: ["{{ host_vpc_address }}"]
    daddr: ["{{ host_vpc_address }}"]
    proto: tcp
    dport: [22]

  # Cluster VMs to the internet through the host's NAT (nft_masquerade):
  # images, packages (decided 28 November 2026).
  - id: 21
    why: Cluster VMs to the internet through NAT
    chain: forward
    iif: [br-shared, br-test, br-demo]
    oif: [eth0]
    proto: tcp
    dport: [443]

  # The mgmt cluster's own pods (k3s on the host), on cni0 only.
  - id: 15
    why: k3s pods to the host's k3s API and kubelet
    chain: input
    iif: [cni0]
    saddr: ["{{ k3s_pod_cidr }}"]
    daddr: ["{{ host_vpc_address }}"]
    proto: tcp
    dport: [6443, 10250]
  - id: 16
    why: k3s pods to k3s pods
    chain: forward
    iif: [cni0]
    oif: [cni0]
    saddr: ["{{ k3s_pod_cidr }}"]
  - id: 17
    why: k3s pods to the internet through NAT (images, charts)
    chain: forward
    iif: [cni0]
    oif: [eth0]
    saddr: ["{{ k3s_pod_cidr }}"]
    proto: tcp
    dport: [443]
  - id: 17
    why: k3s pods to the AWS resolver (CoreDNS forwards to the host's resolver)
    chain: forward
    iif: [cni0]
    oif: [eth0]
    saddr: ["{{ k3s_pod_cidr }}"]
    daddr: ["{{ aws_resolver }}"]
    proto: [udp, tcp]
    dport: [53]
  - id: 22
    why: k3s pods (CAPLV) to the host's sshd, as user caplv only (authorized_keys)
    chain: input
    iif: [cni0]
    saddr: ["{{ k3s_pod_cidr }}"]
    daddr: ["{{ host_vpc_address }}"]
    proto: tcp
    dport: [22]

# Source NAT to the VPC address for the flows that leave by eth0 from a
# cluster bridge (flow 21). The k3s pods' NAT is k3s's own.
nft_masquerade:
  - "{{ clusters.shared.cidr }}"
  - "{{ clusters.test.cidr }}"
  - "{{ clusters.demo.cidr }}"
