# Core layer secrets (Platform Design Decisions 30; Ansible Host baseline,
# pattern 6): SecureString parameters in AWS SSM Parameter Store, read with the
# amazon.aws.ssm_parameter lookup. From a person's box: their Identity Center
# session (AWS_PROFILE=platform). From AAP: the host's instance role, which may
# read only this path. Names: <prefix>/<service>/<name>, the old pass path
# taelron/platform/<service>/<name> with the same relative name.
core_secrets_prefix: /taelron/core
core_secrets_region: eu-central-1
