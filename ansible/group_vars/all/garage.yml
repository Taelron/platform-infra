# Garage on the host (Platform Design Decisions 21): S3 API on
# {{ garage_address }}:3900, data on the Garage volume, one node.
garage_version: v2.5.0
# Multi-platform index of docker.io/dxflrs/garage:v2.5.0 (released
# 24 October 2026); amd64 resolves to sha256:23b16d34e034…
garage_image: docker.io/dxflrs/garage@sha256:677e5b758e4425a325b811c425c026bf35a4bf42f7ddbaa773de3f4fd779a5a5

garage_s3_port: 3900
garage_s3_region: garage
# Capacity given to the layout: 90 GB of the 100 GB volume.
garage_capacity_bytes: 90000000000

# One bucket and one key per consumer, read and write on its own bucket only.
# Secrets in SSM (secrets.yml): garage/{rpc-secret,admin-token,
# metrics-token,<bucket>-key-id,<bucket>-key-secret}.
garage_buckets: [mimir, loki, tempo]
