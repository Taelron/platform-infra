# AAP 2.7, containerized, growth topology (all-in-one) on the host, on the
# shared PostgreSQL (Platform Design Decisions 17; TAE-138, "Step 8 check").

# The online installer, downloaded from Red Hat to the RHEL box (not in Git).
# The role copies it to the host and checks it against this checksum.
aap_installer_file: ansible-automation-platform-containerized-setup-2.7-1.tar.gz
aap_installer_sha256: 1034fcaa0e157908a865f18b4a97c7e8e9d03fb3944aec26e0f9fb6ec4aa2816
aap_installer_src: "{{ lookup('ansible.builtin.env', 'HOME') }}/Downloads/{{ aap_installer_file }}"

# AAP runs rootless as this user; its home, on the AAP volume, holds the
# container storage and AAP's data.
aap_user: aap
aap_home: /var/lib/aap/aap

aap_hostname: aap.shared.taelron.com

# No listener has a bind address: each takes every host address. Envoy is
# the public entry, reached by HAProxy on {{ aap_address }}:9443 (flow 2).
# The others avoid 443 and 8443 (HAProxy, Traefik) and Traefik's 8080.
aap_ports:
  envoy_https_port: 9443
  envoy_http_port: 9080
  gateway_nginx_https_port: 8446
  gateway_nginx_http_port: 8083
  controller_nginx_https_port: 8451
  controller_nginx_http_port: 8089
  hub_nginx_https_port: 8444
  hub_nginx_http_port: 8081
  eda_nginx_https_port: 8445
  eda_nginx_http_port: 8082
  # EDA's API on the loopback; 8000 is Traefik's (k3s).
  eda_gunicorn_port: 8084
  automationmetrics_nginx_https_port: 8450
  automationmetrics_nginx_http_port: 8087
  automationmetrics_api_port: 8006
  gateway_redis_port: 6379
  receptor_port: 27199

# Secrets, read at run time from SSM (secrets.yml): the admin passwords
# (aap/{admin-password,controller-admin-password,hub-admin-password,
# eda-admin-password}) and the database passwords (postgresql/<role>). The
# Registry Service Account is a person's credential and stays in pass
# (taelron/redhat/registry: username, then token); role aap runs from the
# RHEL box only. No subscription manifest:
# the subscription is activated after the install, in the AAP UI.

# AAP's own SSH key, for its job templates (flow 18). The private key is in
# SSM (aap/ssh-key) and in AAP's Machine credential; the
# public key is not a secret. Role base authorises it for this user, from the
# host's own address only: AAP's job containers (slirp4netns) connect from it.
aap_ssh_user: ec2-user
aap_ssh_public_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJIuOL10ceYWAS7EA4PmcGHtst5Iq8esFpvhFSKwXHNR aap@platform-aws-01

# AAP's configuration, written by playbooks/aap_config.yml from the RHEL box.
# AAP runs a job from the repository root, without ansible/ansible.cfg: the
# playbooks find their roles and group_vars through the links next to them
# (playbooks/roles, playbooks/group_vars), and the project sync installs the
# collections from collections/requirements.yml at the root (a link).
aap_config_organization: Taelron
aap_config_project: platform-infra
aap_config_project_url: https://github.com/Taelron/platform-infra.git
aap_config_project_branch: main
aap_config_inventory: platform
aap_config_machine_credential: platform-aws-01
aap_config_registry_credential: registry.redhat.io
# The execution environment, pinned by digest (ee-supported-rhel9, AAP 2.7).
aap_config_ee_name: Taelron EE
aap_config_ee_image: >-
  registry.redhat.io/ansible-automation-platform-27/ee-supported-rhel9@sha256:478010307f8794cf96dac319201f81dfeba5d1b8ab826387dd9781bc41849bd0
# One job template per playbook AAP runs: every role except aap, site and
# the health check. Named "core: <playbook>".
aap_config_playbooks:
  - site
  - base
  - disks
  - network
  - bind
  - postgresql
  - garage
  - haproxy
  - alloy
  - kvm
  - k3s_rancher
  - health
