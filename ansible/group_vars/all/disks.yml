# The data volumes on platform-aws-01 (Platform Design Decisions, Disks), each
# found by its EBS volume ID: the NVMe device number can change between boots.
# The cluster volumes (shared, test, demo) are added in Phase 5 and go to KVM
# as raw disks, not here.
data_volumes:
  - name: k3s
    volume_id: vol-011eec568c1874d8e
    mount: /var/lib/rancher
  - name: postgresql
    volume_id: vol-06b260b8dfacfbb3d
    mount: /var/lib/pgsql
  - name: aap
    volume_id: vol-059cc771c6ab8c05b
    mount: /var/lib/aap
  - name: garage
    volume_id: vol-051684805a6de7171
    mount: /var/lib/garage
