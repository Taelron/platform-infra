---
# AAP's configuration, as code (TAE-138, step 9): the organisation, the
# credentials, the execution environment, the project on GitHub, the
# inventory and one job template per playbook AAP runs.
#
# From the RHEL box only, like role aap, signed in to AWS:
#   AWS_PROFILE=platform .venv/bin/ansible-playbook playbooks/aap_config.yml
#
# Needs ansible.controller and ansible.platform from the AAP installer archive
# (README). Reads AAP's admin password and its SSH key from SSM, and the Red
# Hat registry account (a person's credential) from pass. Credentials are
# written once: a second run leaves their secrets as they are
# (update_secrets: false); a rotated secret is written with
# -e aap_config_update_secrets=true.
- name: AAP configuration
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  module_defaults:
    group/ansible.platform.gateway:
      aap_hostname: "https://{{ aap_hostname }}"
      aap_username: admin
      aap_password: "{{ aap_config_admin_password }}"
      aap_validate_certs: true
    group/ansible.controller.controller:
      controller_host: "https://{{ aap_hostname }}"
      controller_username: admin
      controller_password: "{{ aap_config_admin_password }}"
      validate_certs: true
  vars:
    aap_config_update_secrets: false
  tasks:
    - name: Read AAP's admin password, its SSH key and the registry account
      ansible.builtin.set_fact:
        aap_config_admin_password: >-
          {{ lookup('amazon.aws.ssm_parameter', core_secrets_prefix ~ '/aap/admin-password', region=core_secrets_region) }}
        aap_config_ssh_key: >-
          {{ lookup('amazon.aws.ssm_parameter', core_secrets_prefix ~ '/aap/ssh-key', region=core_secrets_region) }}
        aap_config_registry: >-
          {{ lookup('community.general.passwordstore', 'taelron/redhat/registry', returnall=true).splitlines() }}
      no_log: true

    - name: Organisation {{ aap_config_organization }}
      ansible.platform.organization:
        name: "{{ aap_config_organization }}"
        description: Taelron Platform

    # Without a Galaxy credential on its organisation, the project sync skips
    # collections/requirements.yml ("Collection and role syncing disabled").
    - name: Let the organisation's projects install collections from Galaxy
      ansible.controller.organization:
        name: "{{ aap_config_organization }}"
        galaxy_credentials: ["{{ aap_config_galaxy_credential }}"]

    - name: Registry credential, to pull the execution environment
      ansible.controller.credential:
        name: "{{ aap_config_registry_credential }}"
        organization: "{{ aap_config_organization }}"
        credential_type: Container Registry
        inputs:
          host: registry.redhat.io
          username: "{{ aap_config_registry[0] }}"
          password: "{{ aap_config_registry[1] }}"
          verify_ssl: true
        update_secrets: "{{ aap_config_update_secrets | bool }}"
      no_log: true

    - name: Machine credential, AAP's own SSH key to the host (flow 18)
      ansible.controller.credential:
        name: "{{ aap_config_machine_credential }}"
        organization: "{{ aap_config_organization }}"
        credential_type: Machine
        inputs:
          username: "{{ aap_ssh_user }}"
          ssh_key_data: "{{ aap_config_ssh_key ~ '\n' }}"
          become_method: sudo
        update_secrets: "{{ aap_config_update_secrets | bool }}"
      no_log: true

    - name: Execution environment, pinned by digest
      ansible.controller.execution_environment:
        name: "{{ aap_config_ee_name }}"
        organization: "{{ aap_config_organization }}"
        image: "{{ aap_config_ee_image }}"
        credential: "{{ aap_config_registry_credential }}"
        pull: missing

    - name: The project on GitHub, {{ aap_config_project }}
      ansible.controller.project:
        name: "{{ aap_config_project }}"
        organization: "{{ aap_config_organization }}"
        scm_type: git
        scm_url: "{{ aap_config_project_url }}"
        scm_branch: "{{ aap_config_project_branch }}"
        scm_clean: true
        scm_update_on_launch: true
        default_environment: "{{ aap_config_ee_name }}"
        wait: true

    - name: Inventory {{ aap_config_inventory }}
      ansible.controller.inventory:
        name: "{{ aap_config_inventory }}"
        organization: "{{ aap_config_organization }}"

    - name: The host, at its own address (AAP's jobs run on it)
      ansible.controller.host:
        name: platform-aws-01
        inventory: "{{ aap_config_inventory }}"
        variables:
          ansible_host: "{{ host_vpc_address }}"

    - name: Group host, as in inventory/hosts.yml
      ansible.controller.group:
        name: host
        inventory: "{{ aap_config_inventory }}"
        hosts: [platform-aws-01]

    - name: One job template per playbook
      ansible.controller.job_template:
        name: "core: {{ item }}"
        organization: "{{ aap_config_organization }}"
        project: "{{ aap_config_project }}"
        playbook: ansible/playbooks/{{ item }}.yml
        inventory: "{{ aap_config_inventory }}"
        credentials: ["{{ aap_config_machine_credential }}"]
        execution_environment: "{{ aap_config_ee_name }}"
        become_enabled: true
        job_type: run
      loop: "{{ aap_config_playbooks }}"
