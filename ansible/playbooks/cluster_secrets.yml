---
# Writes into a cluster the Secrets its OpenBao needs to start (TAE-139,
# decisions of 28 November 2026): the static seal key and the PostgreSQL
# storage connection, both from SSM. Run from the RHEL box or AAP.
#
#   .venv/bin/ansible-playbook playbooks/cluster_secrets.yml -e cluster_secrets_name=shared
- name: Bootstrap Secrets into a cluster
  hosts: host
  become: true
  vars:
    cluster_secrets_name: shared
    cluster_secrets_kubeconfig: /root/kubeconfig-{{ cluster_secrets_name }}
  tasks:
    - name: Refuse a cluster that is not listed
      ansible.builtin.assert:
        that: cluster_secrets_name in cluster_secrets_clusters
        quiet: true

    - name: Write the cluster's kubeconfig from mgmt
      ansible.builtin.shell: >-
        set -o pipefail;
        /usr/local/bin/k3s kubectl -n {{ cluster_secrets_name }} get secret {{ cluster_secrets_name }}-kubeconfig
        -o jsonpath='{.data.value}' | base64 -d > {{ cluster_secrets_kubeconfig }}
        && chmod 0600 {{ cluster_secrets_kubeconfig }}
      args:
        executable: /bin/bash
      changed_when: false
      no_log: true

    - name: Write OpenBao's namespace and Secrets
      ansible.builtin.command:
        cmd: /usr/local/bin/k3s kubectl --kubeconfig {{ cluster_secrets_kubeconfig }} apply -f -
        stdin: "{{ objects | map('to_json') | join('\n---\n') }}"
      vars:
        seal_key: "{{ lookup('amazon.aws.ssm_parameter', core_secrets_prefix ~ '/openbao/unseal-key-' ~ cluster_secrets_name, region=core_secrets_region) }}"
        db_password: "{{ lookup('amazon.aws.ssm_parameter', core_secrets_prefix ~ '/postgresql/openbao_' ~ cluster_secrets_name, region=core_secrets_region) }}"
        connection_url: >-
          postgres://openbao_{{ cluster_secrets_name }}:{{ db_password | urlencode }}@{{ postgresql_address }}:5432/{{ db_name }}?sslmode=require
        db_name: openbao_{{ cluster_secrets_name }}
        objects:
          - apiVersion: v1
            kind: Namespace
            metadata: {name: openbao}
          # The static seal reads 32 raw bytes: SSM holds them in base64,
          # which is the Secret's data as is.
          - apiVersion: v1
            kind: Secret
            metadata: {name: openbao-seal, namespace: openbao}
            type: Opaque
            data:
              unseal.key: "{{ seal_key }}"
          - apiVersion: v1
            kind: Secret
            metadata: {name: openbao-storage, namespace: openbao}
            type: Opaque
            data:
              BAO_PG_CONNECTION_URL: "{{ connection_url | b64encode }}"
      register: cluster_secrets_apply
      changed_when: cluster_secrets_apply.stdout_lines | reject('search', ' unchanged$') | list | length > 0
      when: not ansible_check_mode
      no_log: true

    - name: Remove the kubeconfig
      ansible.builtin.file:
        path: "{{ cluster_secrets_kubeconfig }}"
        state: absent
