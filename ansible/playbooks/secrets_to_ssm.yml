---
# Copies the core layer's secrets from pass to AWS SSM Parameter Store
# (Platform Design Decisions 30; Ansible Host baseline, pattern 6).
#
# From the RHEL box only, with a person's Identity Center session:
#   AWS_PROFILE=platform .venv/bin/ansible-playbook playbooks/secrets_to_ssm.yml
#
# Every entry under taelron/platform/ in pass becomes a SecureString under
# /taelron/core/ with the same relative name (aws/ssm key). The value is the
# whole entry, which for a one-line entry is what the roles read today. The
# module compares the decrypted value first, so a second run changes nothing.
# The last task reads every value back from SSM and checks it equals pass.
- name: Core secrets, from pass to SSM Parameter Store
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  vars:
    core_pass_store: "{{ lookup('ansible.builtin.env', 'PASSWORD_STORE_DIR', default=lookup('ansible.builtin.env', 'HOME') ~ '/.password-store') }}"
    core_pass_prefix: taelron/platform
    core_ssm_prefix: /taelron/core
    core_ssm_region: eu-central-1
  tasks:
    - name: List the entries under {{ core_pass_prefix }}
      ansible.builtin.find:
        paths: "{{ core_pass_store }}/{{ core_pass_prefix }}"
        patterns: "*.gpg"
        recurse: true
      register: core_entries

    - name: Name each entry relative to {{ core_pass_prefix }}
      ansible.builtin.set_fact:
        core_names: >-
          {{ core_entries.files | map(attribute='path')
             | map('relpath', core_pass_store ~ '/' ~ core_pass_prefix)
             | map('regex_replace', '\.gpg$', '') | sort }}

    - name: Write each one to SSM as a SecureString
      community.aws.ssm_parameter:
        name: "{{ core_ssm_prefix }}/{{ item }}"
        value: "{{ lookup('community.general.passwordstore', core_pass_prefix ~ '/' ~ item, returnall=true) }}"
        string_type: SecureString
        region: "{{ core_ssm_region }}"
        tags:
          Project: taelron-platform
          ManagedBy: ansible
          Repository: platform-infra
      loop: "{{ core_names }}"
      no_log: true

    - name: Read each one back from SSM and compare it with pass
      ansible.builtin.assert:
        that: >-
          lookup('amazon.aws.ssm_parameter', core_ssm_prefix ~ '/' ~ item, region=core_ssm_region)
          == lookup('community.general.passwordstore', core_pass_prefix ~ '/' ~ item, returnall=true)
        quiet: true
      loop: "{{ core_names }}"
      no_log: true
      when: not ansible_check_mode

    - name: Report
      ansible.builtin.debug:
        msg: >-
          {{ core_names | length }} entries under {{ core_pass_prefix }} in pass,
          {{ 'not compared (check mode)' if ansible_check_mode
             else 'each equal in SSM under ' ~ core_ssm_prefix }}.
