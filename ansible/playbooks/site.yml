---
# Every role of the host, in order. Each role also has its own playbook and tag.
- name: Base RHEL
  ansible.builtin.import_playbook: base.yml

- name: Disks
  ansible.builtin.import_playbook: disks.yml

- name: Network
  ansible.builtin.import_playbook: network.yml

- name: BIND
  ansible.builtin.import_playbook: bind.yml

- name: PostgreSQL
  ansible.builtin.import_playbook: postgresql.yml

- name: Garage
  ansible.builtin.import_playbook: garage.yml
