# OpenTofu for tofu/docs (Taelron Docs); the jobs are in tofu-root.yml, with
# the Lambda@Edge bundle check switched on.
name: tofu-docs

on:
  pull_request:
    branches: [main]
    paths:
      - "tofu/docs/**"
      - ".github/workflows/tofu-docs.yml"
      - ".github/workflows/tofu-root.yml"
      - "tools/inventory/**"
  push:
    branches: [main]
    paths:
      - "tofu/docs/**"
      - ".github/workflows/tofu-docs.yml"
      - ".github/workflows/tofu-root.yml"
      - "tools/inventory/**"

permissions:
  contents: read

jobs:
  tofu:
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    uses: ./.github/workflows/tofu-root.yml
    with:
      root: docs
      edge_check: true
    secrets: inherit
