# OpenTofu for tofu/platform; the jobs are in tofu-root.yml.
name: tofu-platform

on:
  pull_request:
    branches: [main]
    paths:
      - "tofu/**"
      - "!tofu/docs/**"
      - ".github/workflows/tofu-platform.yml"
      - ".github/workflows/tofu-root.yml"
      - "tools/inventory/**"
  push:
    branches: [main]
    paths:
      - "tofu/**"
      - "!tofu/docs/**"
      - ".github/workflows/tofu-platform.yml"
      - ".github/workflows/tofu-root.yml"
      - "tools/inventory/**"

permissions:
  contents: read

jobs:
  tofu:
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    uses: ./.github/workflows/tofu-root.yml
    with:
      root: platform
    secrets: inherit
